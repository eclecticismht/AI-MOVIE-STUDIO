name: Isolated tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: pwsh
        run: ./run-unit-tests.ps1
      - run: node scripts/check-publish.js
